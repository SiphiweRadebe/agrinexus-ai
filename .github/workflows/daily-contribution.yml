name: Profile Pulse

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-pulse-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync-profile:
    name: Synchronize GitHub Profile
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Refresh profile intelligence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path
          from urllib.request import Request, urlopen

          username = os.environ["GITHUB_REPOSITORY_OWNER"]
          token = os.environ["GH_TOKEN"]

          def fetch_api(path):
              request = Request(
                  f"https://api.github.com/{path}",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "User-Agent": "profile-pulse",
                  },
              )
              with urlopen(request, timeout=30) as response:
                  return json.load(response)

          profile = fetch_api(f"users/{username}")

          total_stars = 0
          page = 1

          while True:
              repos = fetch_api(
                  f"users/{username}/repos"
                  f"?per_page=100&page={page}&type=owner"
              )

              total_stars += sum(
                  repo["stargazers_count"]
                  for repo in repos
                  if not repo["fork"]
              )

              if len(repos) < 100:
                  break

              page += 1

          snapshot = (
              "<!-- profile-pulse:start -->\n"
              "### GitHub Snapshot\n\n"
              "| Repositories | Followers | Stars Earned |\n"
              "| :---: | :---: | :---: |\n"
              f"| {profile['public_repos']} "
              f"| {profile['followers']} "
              f"| {total_stars} |\n"
              "<!-- profile-pulse:end -->"
          )

          readme = Path("README.md")
          content = readme.read_text(encoding="utf-8")

          pattern = (
              r"<!-- profile-pulse:start -->"
              r".*?"
              r"<!-- profile-pulse:end -->"
          )

          if re.search(pattern, content, re.DOTALL):
              updated = re.sub(
                  pattern,
                  lambda _: snapshot,
                  content,
                  count=1,
                  flags=re.DOTALL,
              )
          else:
              updated = (
                  content.rstrip()
                  + "\n\n"
                  + snapshot
                  + "\n"
              )

          if updated != content:
              readme.write_text(updated, encoding="utf-8")
              print("Profile snapshot updated.")
          else:
              print("Profile snapshot already current.")
          PY

      - name: Commit meaningful changes
        shell: bash
        run: |
          set -euo pipefail

          git add README.md

          if git diff --cached --quiet; then
            echo "No profile changes detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "docs(profile): refresh GitHub snapshot"
          git push origin "HEAD:${GITHUB_REF_NAME}"
